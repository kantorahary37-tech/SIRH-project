  <style>

    :root {
      --green-main: #2F5D50;
      --green-soft: #3E7C6D;
      --bg: #f4f7f6;
      --card: #ffffff;
      --text: #1F2D2A;
      --muted: #7a8a86;
      --radius: 12px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
    }
    
    /* ===== HEADER ===== */
    header {
      background: linear-gradient(135deg, var(--green-main), var(--green-soft));
      padding: 15px 30px 25px;
      color: white;
    }
    
    /* top */
    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    /* logo */
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    
    .brand img {
      height: 40px;
    }
    
    .brand span {
      font-weight: 600;
      font-size: 18px;
    }
    
    /* search */
    .search {
      position: relative;
    }
    
    .search input {
      padding: 8px 14px 8px 34px;
      border-radius: 20px;
      border: none;
      outline: none;
      width: 240px;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    
    .search input::placeholder {
      color: rgba(255,255,255,0.7);
    }
    
    .search i {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 12px;
    }
    
    /* user */
    .user {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    
    .user i {
      cursor: pointer;
    }
    
    .avatar {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
    }
    
    /* WRAPPER (prend toute la largeur) */
    .nav-wrapper {
      width: 100%;
      padding: 0 20px; /* petit espace sur les côtés */
      margin-top: 25px;
    }
    
    /* CONTAINER GLASS LARGE */
    .nav-icons {
      width: 100%;
      max-width: 900px; /* limite pour pas trop étirer */
      margin: auto;
    
      display: flex;
      justify-content: space-around; /* espace bien réparti */
      align-items: center;
    
      padding: 14px 30px;
      border-radius: 22px;
    
      /* effet glass moderne */
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(14px);
    
      border: 1px solid rgba(255, 255, 255, 0.15);
    
      /* profondeur ++ */
      box-shadow: 
        0 15px 40px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.2);
    }
    
    /* ICONES */
    .nav-icons a {
      color: rgba(255,255,255,0.75);
      font-size: 20px;
      transition: all 0.25s ease;
    }
    
    /* HOVER */
    .nav-icons a:hover {
      color: white;
      transform: translateY(-3px) scale(1.1);
    }
    
    /* ACTIVE */
    .nav-icons .active {
      color: white;
      transform: scale(1.15);
    }
    /* ===== MAIN ===== */
    main {
      padding: 25px;
    }
    
    /* KPI */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .card {
      background: var(--card);
      padding: 20px;
      border-radius: var(--radius);
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .card h4 {
      font-size: 13px;
      color: var(--muted);
    }
    
    .card .value {
      font-size: 28px;
      font-weight: bold;
      margin-top: 5px;
    }
    
    .green { color: #4CAF50; }
    .red { color: #E76F51; }
    .orange { color: #F4A261; }
    
    /* TABLE */
    .section {
      background: var(--card);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }
    
    .section-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
    }
    
    .section-header button {
      background: var(--green-main);
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
    }
    
    th, td {
      padding: 10px;
      font-size: 13px;
      border-bottom: 1px solid #eee;
    }
    
    th {
      text-align: left;
      color: var(--muted);
    }
    
    tr:hover {
      background: #f1f5f4;
    }
    
    </style>
    </head>

<style>

  /* ===== CONTENU PRINCIPAL ===== */
  main {
      padding: 30px 40px;
      font-family: "Segoe UI", , sans-serif;
      background: #F5F7F6;
  }
  
  main h2 {
      font-size: 24px;
      color: #2F5D50;
      margin-bottom: 20px;
      font-weight: 600;
  }
  
  /* ===== FORMULAIRE GLOBAL ===== */
  .agent-form {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      background: #ffffff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      border: 1px solid #e6eeec;
  }
  
  /* ===== COLONNES ===== */
  .form-column {
      flex: 1 1 280px;
      display: flex;
      flex-direction: column;
      gap: 12px;
  }
  
  /* TITRES COLONNES */
  .form-column h3 {
      font-size: 15px;
      font-weight: 600;
      color: #3E7C6D;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #dce7e4;
  }
  
  /* ===== LABELS ===== */
  label {
      font-size: 13px;
      font-weight: 500;
      color: #4b5d59;
      margin-bottom: 2px;
  }
  
  
  
  /* TEXTAREA */
  textarea {
      min-height: 90px;
      resize: vertical;
  }
  
  /* ===== BOUTONS ===== *//* ===== INPUTS / SELECT / TEXTAREA ===== */
  input[type="text"],
  input[type="date"],
  select,
  textarea {
      width: 100%;
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 10px;
      border: 1px solid #d7e3df;
      background: #f9fbfa;
      outline: none;
      transition: all 0.2s ease;
      color: #1f2d2a;
  }
  
  /* HOVER */
  input:hover,
  select:hover,
  textarea:hover {
      border-color: #3E7C6D;
  }
  
  /* FOCUS (effet pro vert) */
  input:focus,
  select:focus,
  textarea:focus {
      border-color: #2F5D50;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(62,124,109,0.15);
  }
  .btns {
      width: 100%;
      display: flex;
      gap: 12px;
      margin-top: 15px;
  }
  
  /* bouton principal */
  .btn-add {
      background: #2F5D50;
      color: white;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
  }
  
  .btn-add:hover {
      background: #24473d;
  }
  
  /* reset */
  .btn-reset {
      background: #e7f0ed;
      color: #2F5D50;
      padding: 10px 16px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
  }
  
  .btn-reset:hover {
      background: #d7e6e1;
  }
  
  /* cancel */
  .btn-cancel {
      background: transparent;
      color: #b42318;
      border: 1px solid #f3c1bb;
      padding: 10px 16px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
  }
  
  .btn-cancel:hover {
      background: #fff2f0;
  }
  
  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
      .agent-form {
          flex-direction: column;
      }
  
      .form-column {
          flex: 1 1 100%;
      }
  
      .btns {
          flex-direction: column;
      }
  }
  
  </style>
